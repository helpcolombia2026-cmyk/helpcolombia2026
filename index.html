        const txt = await res.text();
        if(txt.length < 500) continue;
        return txt;
      }catch(e){}
    }
    return null;
  }
  async function getLiveData(){
    try{
      const html = await fetchViaProxy('https://www.bluradio.com/noticias/ungrd');
      if(!html) return DATA_REAL;
      const get = (re, def) => { const m = html.match(re); return m ? m[1].trim() : def; };
      return {
        fallecidos: get(/(\d+)\s*personas fallecidas/i, DATA_REAL.fallecidos),
        desaparecidas: get(/(\d+)\s*desaparecidas/i, DATA_REAL.desaparecidas),
        heridas: get(/(\d+[.,]?\d*)\s*heridas/i, DATA_REAL.heridas),
        destruidas: get(/(\d+[.,]?\d*)\s*viviendas destruidas/i, DATA_REAL.destruidas),
        averiadas: get(/(\d+[.,]?\d*)\s*viviendas averiadas/i, DATA_REAL.averiadas),
        educativos: get(/(\d+[.,]?\d*)\s*centros educativos/i, DATA_REAL.educativos),
        salud: get(/(\d+)\s*centros de salud/i, DATA_REAL.salud),
        vias: get(/(\d+)\s*vías afectadas/i, DATA_REAL.vias),
        afectadas: get(/(\d+[.,]?\d*)\s*personas afectadas/i, DATA_REAL.afectadas)
      };
    }catch(e){ return DATA_REAL; }
  }
  function saltarCuadros(){
    document.querySelectorAll('#balance [class*="rounded-[20px]"]').forEach((el,i)=>{
      setTimeout(()=>{
        el.classList.remove('live-vibrate');
        void el.offsetWidth;
        el.classList.add('live-vibrate');
      }, i*90);
    });
  }
  function updateBalance(d){
    window._lastLiveData = d;
    const map = {
      'VIVIENDAS DESTRUIDAS': d.destruidas,
      'VIVIENDAS AVERIADAS': d.averiadas,
      'CENTROS EDUCATIVOS': d.educativos,
      'CENTROS DE SALUD': d.salud,
      'VÍAS AFECTADAS': d.vias,
      'PERSONAS AFECTADAS': d.afectadas
    };
    document.querySelectorAll('#balance [class*="rounded-[20px]"]').forEach(card=>{
      const labelEl = card.querySelector('div:last-child');
      if(!labelEl) return;
      const label = labelEl.textContent.trim().toUpperCase();
      for(const k in map){
        if(label.includes(k.split(' ')[0])){
          const numEl = card.querySelector('div:first-child');
          if(numEl) numEl.textContent = map[k];
        }
      }
      // fuente en vivo eliminada por petición - no mostrar en tarjetas
      const existingSrc = card.querySelector('.src-caracol');
      if(existingSrc) existingSrc.remove();
    });
    saltarCuadros();
    const p = document.querySelector('#balance p');
    if(p){
      p.innerHTML = `desde fuentes confiables · En vivo <b>caracol</b> + UNGRD: <b>${d.fallecidos}</b> fallecidos, <b>${d.desaparecidas}</b> desaparecidos, <b>${d.heridas}</b> heridos. <span style="opacity:.6">Actualizado ${new Date().toLocaleTimeString('es-CO')} · caracol.com.co</span>`;
    }
  }
  async function run(){
    const data = await getLiveData();
    updateBalance(data);
  }
  document.addEventListener('DOMContentLoaded', run);
  setInterval(run, 5*60*1000);
  setTimeout(saltarCuadros, 1200);
})();
</script>
